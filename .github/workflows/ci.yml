name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    php:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/install-dagger

            - name: Validate composer.json
              run: dagger call validate

            # The PHP / Symfony support matrix is defined once, in
            # .dagger/src/turbo_toast/main.py — not duplicated here.
            - name: Run the PHP / Symfony matrix
              run: dagger call matrix

            - name: Lint Twig templates
              run: dagger call lint

    assets:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: ./.github/actions/install-dagger

            - name: Check dist sync and run Stimulus tests
              run: dagger call assets
